services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hanzi
      POSTGRES_USER: hanzi
      POSTGRES_PASSWORD: hanzi
    ports:
      - "5432:5432"
    volumes:
      - hanzi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanzi -d hanzi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hanzi_postgres_data:
