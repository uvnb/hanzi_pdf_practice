name: Tu dong Dong Mo server Railway
on:
  schedule:
    - cron: '0 17 * * *'    # 12h đêm VN
    - cron: '30 0 * * *'   # 7h30 sáng VN
  workflow_dispatch:        # Dòng này giúp bạn có thể bấm CHẠY THỬ THỦ CÔNG trên GitHub để test luôn

jobs:
  control-service:
    runs-on: ubuntu-latest
    steps:
      - name: Khoi tao moi truong Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Cai dat công cu dieu khien Railway
        run: npm install -g @railway/cli

      - name: Kiem tra gio va thuc thi lenh
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          CURRENT_HOUR=$(date -u +%H)

          # Biện pháp cưỡng chế liên kết tài khoản bằng Token
          railway auth:token $RAILWAY_TOKEN

          if [ "$CURRENT_HOUR" -eq 17 ]; then
            echo "Tắt dịch vụ..."
            # Truyền thêm tham số --project để CLI biết chính xác mục tiêu
            railway down --project ${{ secrets.RAILWAY_PROJECT_ID }} --service nihongo-production --assumeyes
          else
            echo "Bật dịch vụ..."
            railway up --project ${{ secrets.RAILWAY_PROJECT_ID }} --service nihongo-production --detach
          fi
