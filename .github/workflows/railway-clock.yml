name: Tu dong Dong Mo server Railway

on:
  schedule:
    - cron: '13 17 * * *'   # ~12h13 đêm VN (17:13 UTC) -> TAT
    - cron: '37 0 * * *'    # ~7h37 sáng VN (00:37 UTC) -> BAT
  workflow_dispatch:
    inputs:
      action:
        description: 'Chon hanh dong (auto/stop/start)'
        required: true
        default: 'auto'
        type: choice
        options:
        - auto
        - stop
        - start

jobs:
  control-service:
    runs-on: ubuntu-latest
    steps:
      - name: Xac dinh hanh dong
        id: decide
        run: |
          ACTION="${{ github.event.inputs.action || 'auto' }}"
          CURRENT_HOUR=$(date -u +%H)
          CURRENT_MIN=$(date -u +%M)
          echo "Gio UTC hien tai: ${CURRENT_HOUR}:${CURRENT_MIN}"
          echo "Input action: $ACTION"

          if [ "$ACTION" = "stop" ]; then
            DECISION="stop"
          elif [ "$ACTION" = "start" ]; then
            DECISION="start"
          else
            HOUR_INT=$((10#$CURRENT_HOUR))
            MIN_INT=$((10#$CURRENT_MIN))
            # Khung gio tat: 17:00 - 00:29 UTC (0h - 7h29 VN)
            if [ "$HOUR_INT" -ge 17 ] || { [ "$HOUR_INT" -eq 0 ] && [ "$MIN_INT" -lt 30 ]; }; then
              DECISION="stop"
            else
              DECISION="start"
            fi
          fi

          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "Quyet dinh: $DECISION"

      - name: TAT - Xoa deployment hien tai
        if: steps.decide.outputs.decision == 'stop'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          echo "Buoc 1: Lay deployment ID hien tai..."
          QUERY='query { deployments(input: { environmentId: \"'$RAILWAY_ENVIRONMENT_ID'\", serviceId: \"'$RAILWAY_SERVICE_ID'\" }, first: 1) { edges { node { id status } } } }'

          RESULT=$(curl -s -X POST \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"query\": \"$QUERY\"}" \
            https://backboard.railway.app/graphql/v2)

          echo "Query result: $RESULT"

          DEPLOY_ID=$(echo "$RESULT" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

          if [ -z "$DEPLOY_ID" ]; then
            echo "Khong tim thay deployment nao dang chay. Co the da tat roi."
            exit 0
          fi

          echo "Buoc 2: Xoa deployment $DEPLOY_ID..."
          REMOVE_RESULT=$(curl -s -X POST \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"query\": \"mutation { deploymentRemove(id: \\\"$DEPLOY_ID\\\") }\"}" \
            https://backboard.railway.app/graphql/v2)

          echo "Remove result: $REMOVE_RESULT"

          if echo "$REMOVE_RESULT" | grep -q '"errors"'; then
            echo "LOI khi xoa deployment!"
            exit 1
          fi

          echo "Da tat service thanh cong!"

      - name: BAT - Redeploy service
        if: steps.decide.outputs.decision == 'start'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          echo "Dang redeploy service..."
          RESULT=$(curl -s -X POST \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"query\": \"mutation { serviceInstanceRedeploy(environmentId: \\\"$RAILWAY_ENVIRONMENT_ID\\\", serviceId: \\\"$RAILWAY_SERVICE_ID\\\") }\"}" \
            https://backboard.railway.app/graphql/v2)

          echo "Redeploy result: $RESULT"

          if echo "$RESULT" | grep -q '"errors"'; then
            echo "LOI khi redeploy!"
            exit 1
          fi

          echo "Da bat service thanh cong!"
