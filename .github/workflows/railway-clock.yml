name: Tu dong Dong Mo server Railway

on:
  schedule:
    - cron: '0 17 * * *'   # 12h đêm VN (17:00 UTC)
    - cron: '30 0 * * *'   # 7h30 sáng VN (00:30 UTC)
  workflow_dispatch:        # Nút bấm chạy thử bằng tay
    inputs:
      action:
        description: 'Chon hanh dong (auto/stop/start)'
        required: true
        default: 'auto'
        type: choice
        options:
        - auto
        - stop
        - start

jobs:
  control-service:
    runs-on: ubuntu-latest
    steps:
      - name: Kiem tra gio va goi Railway API
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          ACTION="${{ github.event.inputs.action || 'auto' }}"

          if [ "$ACTION" = "stop" ]; then
            REPLICAS=0
            echo "Che do thu cong: Tat service (replicas=0)..."
          elif [ "$ACTION" = "start" ]; then
            REPLICAS=1
            echo "Che do thu cong: Bat service (replicas=1)..."
          else
            CURRENT_HOUR=$(date -u +%H)
            CURRENT_MIN=$(date -u +%M)
            echo "Gio UTC hien tai: ${CURRENT_HOUR}:${CURRENT_MIN}"

            if [ "$CURRENT_HOUR" -eq 17 ]; then
              REPLICAS=0
              echo "12h dem VN: Tat service (replicas=0)..."
            else
              REPLICAS=1
              echo "7h30 sang VN: Bat service (replicas=1)..."
            fi
          fi

          # Goi Railway GraphQL API de thay doi so replicas
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"query\": \"mutation { serviceInstanceUpdate(environmentId: \\\"$RAILWAY_ENVIRONMENT_ID\\\", serviceId: \\\"$RAILWAY_SERVICE_ID\\\", input: { numReplicas: $REPLICAS }) }\"}" \
            https://backboard.railway.app/graphql/v2)

          echo "HTTP Status: $RESPONSE"
          if [ "$RESPONSE" -ne 200 ]; then
            echo "Loi! API tra ve HTTP $RESPONSE"
            exit 1
          fi
          echo "Thanh cong! Service da duoc cap nhat replicas=$REPLICAS"
