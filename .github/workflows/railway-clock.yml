name: Tu dong Dong Mo server Railway

on:
  schedule:
    - cron: '0 17 * * *'    # 12h đêm VN
    - cron: '30 0 * * *'   # 7h30 sáng VN
  workflow_dispatch:        # Giúp xuất hiện nút bấm chạy thử bằng tay

jobs:
  control-service:
    runs-on: ubuntu-latest
    steps:
      - name: Khoi tao moi truong Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Cai dat cong cu dieu khien Railway
        run: npm install -g @railway/cli

      - name: Kiem tra gio va thuc thi lenh
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          CURRENT_HOUR=$(date -u +%H)
          echo "Gio UTC hien tai la: $CURRENT_HOUR"

          if [ "$CURRENT_HOUR" -eq 17 ]; then
            echo "Con meo den keu: Den gio di ngu! Dang tat dịch vu..."
            railway down --service nihongo-production --assumeyes
          else
            echo "Binh minh len! Dang bat lai dịch vu..."
            railway up --service nihongo-production --detach
          fi
